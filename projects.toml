# Cards on the profile README. One [[project]] block per card.
#
# To add a project: copy a block, fill it in, and run `python scripts/build.py`.
# The newest project (by date) becomes the wide card at the top. Older ones
# fill the grid two per row; if the count is odd, the oldest moves to the
# text list under "More on GitHub".
#
# Public repos that have no block here still show up in that text list,
# using the repo's own description, so nothing public is ever left out.
#
# accent: teal (evals), clay (experiments), ochre (cost), indigo (LLMs, RAG)
# bars: the highlighted bar is drawn in the accent colour.
# caption_short: optional, used in the grid if the caption is too long there.

[[project]]
repo = "rag-per-dollar"
date = "2026-11-21"
kind = "Study"
area = "RAG"
accent = "indigo"
question = "Which RAG upgrades are worth paying for?"
big = "9 of 24"
caption = "RAG setups on multi-hop questions scored below a guess that never reads the documents. Retrieval scores ranked setups well but overstated what an upgrade is worth."
caption_short = "RAG setups on multi-hop questions scored below a guess that never reads the documents."
bars = [
  { label = "Best setup", value = 71, text = "71%", highlight = true },
  { label = "Guess, never reads", value = 48.1, text = "48%" },
  { label = "Worst setup", value = 30, text = "30%" },
]
link = "https://github.com/ai-with-md/rag-per-dollar"
cta = "See which upgrade to buy first"
alt = "rag-per-dollar: on multi-hop questions, 9 of 24 RAG setups scored below a guess that never reads the documents. The best setup got 71% right, the worst 30%."

